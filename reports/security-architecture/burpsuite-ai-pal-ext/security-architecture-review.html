# Security Architecture Review: AI Pal v1.2.1

## 1. Executive summary

AI Pal is a Swing extension inside Burp. It takes captured HTTP traffic from a hostile target and sends it to an LLM backend. The trust zones are sound on paper, but the code enforces almost none of the boundaries between them. The design rests on one assumption: the model will behave. The code never states that assumption, and nothing contains the damage if it fails.

Three design risks matter most:

1. **Agent capability confinement is a deny-list on vendor flag semantics, inside the user's own agent configuration (SA-001, SA-002).** Claude Code, Codex and Kiro CLI are launched as agents with `cwd=user.home` and the full parent environment. Only the built-in tools are switched off. A prompt hijack from a target's response body lands in a process that loads the tester's MCP servers and settings.
2. **There is no egress governance (SA-004).** All headers (cookies, bearer tokens) and bodies go to the active provider with no classification, redaction, consent, scope check or preview. `LLMProvider.getApiHost()` defines the destination, labels the cloud-bound CLIs "localhost", and has no callers.
3. **There is no instruction/data separation (SA-003).** Traffic is concatenated raw into prompts. The CLI backends flatten roles into plain text. No system prompt tells the model to treat the traffic as data. On its own this is mainly an integrity problem. Combined with SA-001 it becomes a path to action.

13 findings: **3 High, 6 Medium, 4 Low**. All 13 carry a recommended control. Eleven map to a secreview or skill-reviewer finding that I re-verified against current source. SA-013 is design-level only. The Kiro half of SA-002 has no corroboration in any input. Claims that could not be tested live are flagged per finding.

Two scope notes:
- The brief names four backends. The source has **five**: `KiroClient` (`llm/impl/KiroClient.java`, untracked in git) is wired into the factory (`LLMClientFactory.java:46-49`). Neither input report covers it.
- The working tree changed during this review. `LLMSettingsPanel.java` was 1205 lines in the secreview run, 1368 early in this review and 1411 at the end. Line numbers for that file are a snapshot taken 2026-11-09 09:36.

## 2. Mode, framework, method

- **Mode:** as-built. I reverse-engineered the architecture from source. There are no ADRs or design diagrams. The only design intent documents are `CLAUDE.md`, code comments, and `docs/`. `docs/` is gitignored (`.gitignore:42`), so I treated it as unreliable.
- **Framework:** ASVS 4.0.3 architecture requirements, NIST 800-53 Rev 5 families, and the OWASP LLM Top 10 **2025** numbering (LLM01 Prompt Injection, LLM02 Sensitive Information Disclosure, LLM03 Supply Chain, LLM05 Improper Output Handling, LLM06 Excessive Agency, LLM09 Misinformation, LLM10 Unbounded Consumption). Several ASVS IDs below are my best recollection of the 4.0.3 numbering and were not checked against the standard text here. Treat them as `to be confirmed`.
- **Tools available here:** the code was read and grepped. `claude --version` and `claude --help` (v2.1.318) were run locally to check flag semantics. **No model call was made.** `codex`, `kiro-cli` and `ollama` are not installed, and there is no live Burp or AWS. Anything that depends on runtime behaviour is labelled *unverified live*.

## 4. Authorization / capability coverage matrix (pass-2 B2)

This application has no routes or multi-user model. The equivalent of "a route behind a role gate" is an **entry point that can send data to a backend**, and **the capability a backend keeps after a hijack**. I recorded the triple for each: (1) what gates it, (2) whether a scope or destination attribute is *computed*, (3) whether that attribute is *applied*.

### 4.1 Entry points (data egress)

| Entry point | (1) Gate | (2) Attribute computed | (3) Applied? |
|---|---|---|---|
| Context menu Analyze / Explain / Attack Vectors / Custom (`LLMContextMenuProvider.java:85,111,137,163`) | `checkConfig()` = provider has a valid config (`:188`) | Selected items count; provider display name (dialog title only) | **No scope check, no consent, no item or byte cap.** `formatItems` (`:201`) concatenates every selected item |
| Context menu Chat → `ChatPanel` (`ChatSessionPanel.java:62-63`, `ChatPanel.java:154,185`) | `hasValidConfig()` | Attached request text | Whole history, including every attachment, is **resent every turn** (`ChatMessage.java:62-64`, `history.getMessages()` at `ChatPanel.java:185`) |
| Repeater editor tab (`LLMSecurityAssistantEditorPanel.java:44,149-152,173`) | `hasValidConfig()` | Request toggle **on by default** (`:44`) | No scope check, no redaction. The user sees a label, not the payload |
| Settings `Test Connection` (`LLMSettingsPanel.java:1373`) | none | none | Fixed prompt, no traffic |

No code in `src/` references Burp scope, redaction or consent (`isInScope`, `redact`, `consent`, `showConfirmDialog` all return 0 hits).

**Computed-then-discarded, found twice:**
- `LLMProvider.apiHost` (`LLMProvider.java:6-10,22`) records the data destination. It is `"localhost"` for `CLAUDE_CODE`, `CODEX` and `KIRO`, although those CLIs send the traffic to a vendor cloud. `getApiHost()` has **zero callers**. A destination attribute exists, is wrong for three of five providers, and is never applied.
- `BedrockClient.credentialSource` (`:41,93,103,110,114`) records whether the keys came from settings, environment or `~/.aws/credentials` (and which profile). `getCredentialSource()` (`:118`) is private and has no callers. The user never sees which AWS account they are about to send client data to.

## 6. Design options for the top 3 risks

### 6.1 Top risk 1: agent capability confinement (SA-001, SA-002)

| Option | What it does | Gains | Costs / trade-offs |
|---|---|---|---|
| A. Harden flags | Add `--strict-mcp-config`, `--disallowedTools "mcp__*"`, `--no-session-persistence`, `--disable-slash-commands`, `--setting-sources` (or `--safe-mode`); Codex `--ignore-user-config`; empty temp directory as `cwd`; allow-list the child environment | Small change. Closes the documented gap | Still the user's account and installed binary. Flag semantics can drift between versions. `--bare` would force `ANTHROPIC_API_KEY` auth and break subscription login |
| B. Dedicated profile per provider | Point each CLI at an extension-owned config directory (for example `CLAUDE_CONFIG_DIR`, `CODEX_HOME`) with no MCP, hooks or plugins | Removes dependence on denying individual features. Cleaner invariants | The tester must log in a second time. Each CLI needs its own isolation knob (*unverified for Codex and Kiro*) |
| C. Direct API clients, no agent | Replace the agent CLIs with HTTPS calls to the vendor model APIs | Eliminates the class: there is nothing to confine | Needs API keys (returns to SA-005). Loses subscription auth. May change the licensing position the docs claim for "local CLI usage" |
| D. OS sandbox | Run the CLI in a container, AppContainer or bwrap with no network except the vendor | Strongest, enforced below the app | Heavy and different per OS. Fragile for a Burp extension |

**Recommendation:** A now, plus a **runtime canary** at provider enable time. The canary sends a prompt that asks the model to call a tool, and the provider is refused if any `tool_use` or tool event appears. B is the target design. Offer C to strict users. D is not worth its cost here.

### 6.2 Top risk 2: egress governance (SA-004)

| Option | What it does | Gains | Costs / trade-offs |
|---|---|---|---|
| A. Redaction by default | Mask `Authorization`, `Cookie`, `Set-Cookie`, API-key headers and secret-named body keys in `HttpRequestFormatter` | Cheap. Protects the common case | Heuristic. Blinds analysis of tokens and session handling, which the prompts ask for (`PromptTemplates.java:30`), so it needs an opt-out |
| B. Pre-send gate with provider tiers | Give each provider a data-handling tier (local / customer-controlled cloud / vendor cloud). First use per project asks for consent naming the destination. Show an editable preview with byte count. Warn or block out-of-scope items on cloud tiers. Cap items and bytes | Fixes the root cause: the destination and scope attributes become applied. Auditable | Click fatigue. Mitigate by remembering the choice per project. Needs a correct destination per provider (today `getApiHost()` is wrong) |
| C. Engagement-level local-only mode | One setting that disables cloud providers for the project | Simple to explain to a client. Strong guarantee | Coarse. Local models are weaker |

**Recommendation:** B with A as its default content policy, and C as an organisational switch. The destination for the three CLIs must be recorded as a vendor cloud, not `localhost`.

### 6.3 Top risk 3: instruction/data separation (SA-003)

| Option | What it does | Gains | Costs / trade-offs |
|---|---|---|---|
| A. Prompt hygiene | Per-request random-nonce fence, strip or escape the fence and line-initial `User:` / `Assistant:` / `System:` in the data, an "untrusted data" clause in every system prompt (including Custom Prompt), pin the system prompt against eviction | Cheap. Removes the trivial forgeries | Probabilistic. A fence is not a security boundary |
| B. Structured channels | Use native system roles or system-prompt flags and pass the traffic as a separate data block (a content block for Bedrock, a JSON-encoded block for CLI stdin) | Real role separation on the backends that support it | The CLIs offer less control. Per-vendor work |
| C. Assume the model is compromised whenever it reads target content | Rely on SA-001 confinement and add output-side controls: provenance banner, no auto-copy of generated payloads, optionally a second pass that checks the output against the input | The only option that bounds the impact | Extra latency and cost for the second pass. UX friction |

**Recommendation:** all three, in this order of dependence: C (via SA-001) is the control, A and B reduce the hit rate. State plainly in the docs that prompt injection cannot be fully prevented at the prompt layer.

## 7. Cross-cutting design notes

- **Secrets and key management.** Today: plaintext in Burp preferences (SA-005), then credentials in the Burp HTTP stack (SA-006), then the environment inherited by CLI children (SA-001). A key set once travels through three zones. Prefer short-lived credentials from the AWS SDK chain or an OS keychain, and scrub the child environment to an allow-list.
- **Data minimisation and consent.** Neither exists as a concept in the design (SA-004). The chat design makes it worse: every turn re-sends all attachments, up to 100 messages (`ConversationHistory.java:9`).
- **Availability.** The pool design is a single point of failure (SA-008). Windows adds a PATH-separator bug (`CliEnvironmentUtil.java:29` hard-codes `:`).
- **Tool-chain dependency.** Safety rests on how three vendor CLIs interpret flags in versions the extension never checks (SA-009). The model lists in `LLMSettings.java` are hard-coded and will age.
